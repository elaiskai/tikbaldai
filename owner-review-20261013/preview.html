<!doctype html><html lang="lt"><head><meta charset="utf-8"><title>TIK BALDAI · atnaujinti laiškai</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#E6E5E0;font:16px Arial}header{padding:22px;background:#202221;color:#F4F0E8}h1{font-size:24px;margin:0 0 16px}select{padding:10px;font:16px Arial}label{margin-right:12px}main{padding:24px 0}iframe{display:block;margin:auto;border:0;max-width:100%}p{max-width:800px;line-height:1.5}</style></head><body><header><h1>TIK BALDAI · atnaujinta pagal kliento pastabas</h1><label>Laiškas <select id="campaign"><option value="welcome-01">welcome-01</option><option value="welcome-02">welcome-02</option><option value="welcome-03">welcome-03</option><option value="product-01">product-01</option><option value="product-02">product-02</option><option value="cart-01">cart-01</option><option value="cart-02">cart-02</option><option value="cart-03">cart-03</option><option value="checkout-01">checkout-01</option><option value="checkout-02">checkout-02</option><option value="winback-01">winback-01</option><option value="winback-02">winback-02</option><option value="winback-03">winback-03</option></select></label><label>Plotis <select id="width"><option>320</option><option selected>390</option><option>430</option><option>600</option></select></label><label><input id="stripped" type="checkbox"> Be head stilių</label><p>35 € welcome pasiūlymas. SVEIKI35 yra siūlomas kodas. Pilki plotai žymi Omnisend dinamines prekes. Winback laikai teikiami patvirtinti.</p></header><main><iframe id="email" title="Laiško maketas"></iframe></main><script>const f=document.querySelector('#email'),sel=document.querySelector('#campaign'),w=document.querySelector('#width'),s=document.querySelector('#stripped');function load(){f.width=w.value;f.src=sel.value+'/'+(s.checked?'stripped':'email')+'.html'}function fit(){f.height=100;f.height=f.contentDocument.documentElement.scrollHeight}f.onload=()=>{fit();for(const i of f.contentDocument.images)i.addEventListener('load',fit)};for(const el of [sel,w,s])el.onchange=load;load();</script></body></html>
